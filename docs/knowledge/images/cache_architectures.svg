<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="460" y="35" font-size="18" font-weight="bold" fill="#1a1f36" text-anchor="middle">Các Kiến Trúc Lưu Trữ Cache trong Hugging Face Transformers</text>

  <!-- Card 1: DynamicCache -->
  <g transform="translate(30, 65)">
    <rect width="270" height="230" rx="10" fill="#ffffff" stroke="#91caff" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="270" height="42" rx="10" fill="#e6f4ff"/>
    <path d="M0 42 L270 42" stroke="#91caff" stroke-width="1"/>
    <text x="135" y="27" font-size="15" font-weight="bold" fill="#0958d9" text-anchor="middle">1. DynamicCache</text>
    
    <text x="18" y="70" font-size="12" font-weight="bold" fill="#262626">• Hành vi mặc định</text>
    <text x="18" y="92" font-size="12" fill="#595959">Kích thước tăng dần liên tục theo</text>
    <text x="18" y="110" font-size="12" fill="#595959">chiều dài chuỗi sinh mới.</text>
    
    <!-- Visual Representation -->
    <rect x="18" y="130" width="70" height="26" rx="4" fill="#bae0ff" stroke="#69b1ff"/>
    <text x="53" y="147" font-size="11" fill="#003a8c" text-anchor="middle">seq_1</text>
    <text x="96" y="148" font-size="14" fill="#0958d9">→</text>
    <rect x="112" y="130" width="138" height="26" rx="4" fill="#91caff" stroke="#4096ff"/>
    <text x="181" y="147" font-size="11" fill="#002c8c" text-anchor="middle">seq_1 + seq_2 (+cat)</text>
    
    <rect x="18" y="175" width="234" height="40" rx="6" fill="#f0f5ff"/>
    <text x="28" y="193" font-size="11" font-weight="600" fill="#1d39c4">Ưu điểm: Linh hoạt cao</text>
    <text x="28" y="208" font-size="11" fill="#595959">Nhược điểm: Tốn công tái cấp phát VRAM</text>
  </g>

  <!-- Card 2: StaticCache -->
  <g transform="translate(325, 65)">
    <rect width="270" height="230" rx="10" fill="#ffffff" stroke="#b7eb8f" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="270" height="42" rx="10" fill="#f6ffed"/>
    <path d="M0 42 L270 42" stroke="#b7eb8f" stroke-width="1"/>
    <text x="135" y="27" font-size="15" font-weight="bold" fill="#237804" text-anchor="middle">2. StaticCache</text>
    
    <text x="18" y="70" font-size="12" font-weight="bold" fill="#262626">• Cấp phát bộ nhớ tĩnh</text>
    <text x="18" y="92" font-size="12" fill="#595959">Cấp phát cố định vùng nhớ tối đa</text>
    <text x="18" y="110" font-size="12" fill="#595959">(max_seq_len) ngay từ đầu.</text>
    
    <!-- Visual Representation -->
    <rect x="18" y="130" width="234" height="26" rx="4" fill="#f6ffed" stroke="#73d13d" stroke-dasharray="4,3"/>
    <rect x="18" y="130" width="110" height="26" rx="4" fill="#b7eb8f" stroke="#52c41a"/>
    <text x="73" y="147" font-size="11" fill="#135200" text-anchor="middle">Đã dùng (Active)</text>
    <text x="180" y="147" font-size="11" fill="#8c8c8c" text-anchor="middle">Đệm trống (Masked)</text>

    <rect x="18" y="175" width="234" height="40" rx="6" fill="#f6ffed"/>
    <text x="28" y="193" font-size="11" font-weight="600" fill="#237804">Ưu điểm: Tối ưu torch.compile &amp; JIT</text>
    <text x="28" y="208" font-size="11" fill="#595959">Nhược điểm: Chiếm dung lượng VRAM lớn</text>
  </g>

  <!-- Card 3: StaticSlidingWindowCache -->
  <g transform="translate(620, 65)">
    <rect width="270" height="230" rx="10" fill="#ffffff" stroke="#ffd591" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect width="270" height="42" rx="10" fill="#fffbe6"/>
    <path d="M0 42 L270 42" stroke="#ffd591" stroke-width="1"/>
    <text x="135" y="27" font-size="14" font-weight="bold" fill="#d46b08" text-anchor="middle">3. SlidingWindowCache</text>
    
    <text x="18" y="70" font-size="12" font-weight="bold" fill="#262626">• Cửa sổ trượt cố định (W)</text>
    <text x="18" y="92" font-size="12" fill="#595959">Giới hạn kích thước cache ở W token.</text>
    <text x="18" y="110" font-size="12" fill="#595959">Token cũ nhất sẽ bị đẩy ra ngoài.</text>
    
    <!-- Visual Representation -->
    <rect x="18" y="130" width="40" height="26" rx="4" fill="#fff1f0" stroke="#ffa39e"/>
    <text x="38" y="147" font-size="10" fill="#cf1322" text-anchor="middle">Evict</text>
    <text x="63" y="148" font-size="13" fill="#d46b08">←</text>
    <rect x="75" y="130" width="177" height="26" rx="4" fill="#ffe7ba" stroke="#ffa940"/>
    <text x="163" y="147" font-size="11" fill="#873800" text-anchor="middle">Cửa sổ trượt kích thước W</text>

    <rect x="18" y="175" width="234" height="40" rx="6" fill="#fffbe6"/>
    <text x="28" y="193" font-size="11" font-weight="600" fill="#d46b08">Ưu điểm: VRAM cố định, không lo OOM</text>
    <text x="28" y="208" font-size="11" fill="#595959">Nhược điểm: Mất ngữ cảnh xa hơn W</text>
  </g>
</svg>
