<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="100%" style="background-color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f0"/>
      <stop offset="100%" stop-color="#ffeae8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6ffed"/>
      <stop offset="100%" stop-color="#eaffd9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#e03131" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2f9e44" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="460" y="38" font-size="20" font-weight="bold" fill="#1a1f36" text-anchor="middle">So Sánh Cơ Chế Hoạt Động Của KV Cache Trong Transformer</text>

  <!-- Left Box: Without Cache -->
  <rect x="30" y="65" width="415" height="390" rx="10" fill="#fafafa" stroke="#e8e8e8" stroke-width="1.5"/>
  <rect x="30" y="65" width="415" height="48" rx="10" fill="url(#redGrad)"/>
  <path d="M30 113 L445 113" stroke="#ffa39e" stroke-width="1"/>
  <text x="237" y="94" font-size="15" font-weight="bold" fill="#cf1322" text-anchor="middle">KHÔNG CÓ KV CACHE (Tái tính toán lặp lại)</text>

  <!-- Left Steps -->
  <!-- Step 1 -->
  <g transform="translate(50, 130)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#ffd8d6" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước 1:</text>
    <text x="75" y="28" font-size="13" fill="#212529">Tính Q, K, V cho <tspan font-weight="bold" fill="#cf1322">Token 1</tspan></text>
  </g>
  <line x1="237" y1="176" x2="237" y2="192" stroke="#e03131" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Step 2 -->
  <g transform="translate(50, 195)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#ffd8d6" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước 2:</text>
    <text x="75" y="28" font-size="13" fill="#cf1322" font-weight="bold">Tính lại </text>
    <text x="130" y="28" font-size="13" fill="#212529">Q, K, V cho <tspan font-weight="bold">Token 1, 2</tspan></text>
  </g>
  <line x1="237" y1="241" x2="237" y2="257" stroke="#e03131" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Step 3 -->
  <g transform="translate(50, 260)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#ffd8d6" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước 3:</text>
    <text x="75" y="28" font-size="13" fill="#cf1322" font-weight="bold">Tính lại </text>
    <text x="130" y="28" font-size="13" fill="#212529">Q, K, V cho <tspan font-weight="bold">Token 1, 2, 3</tspan></text>
  </g>
  <line x1="237" y1="306" x2="237" y2="322" stroke="#e03131" stroke-width="1.5" marker-end="url(#arrowRed)"/>

  <!-- Step t -->
  <g transform="translate(50, 325)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#ffd8d6" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước t:</text>
    <text x="75" y="28" font-size="13" fill="#cf1322" font-weight="bold">Tính lại </text>
    <text x="130" y="28" font-size="13" fill="#212529">Q, K, V cho cả <tspan font-weight="bold">t token</tspan></text>
  </g>

  <!-- Left Summary Box -->
  <rect x="50" y="390" width="375" height="50" rx="6" fill="#fff2f0" stroke="#ffccc7"/>
  <text x="65" y="411" font-size="12" font-weight="bold" fill="#a8071a">• Độ phức tạp tính toán: O(T²)</text>
  <text x="65" y="429" font-size="12" fill="#595959">• Lãng phí GPU do liên tục nhân ma trận lặp lại</text>


  <!-- Right Box: With Cache -->
  <rect x="475" y="65" width="415" height="390" rx="10" fill="#fafafa" stroke="#e8e8e8" stroke-width="1.5"/>
  <rect x="475" y="65" width="415" height="48" rx="10" fill="url(#greenGrad)"/>
  <path d="M475 113 L890 113" stroke="#b7eb8f" stroke-width="1"/>
  <text x="682" y="94" font-size="15" font-weight="bold" fill="#237804" text-anchor="middle">CÓ KV CACHE (Tái sử dụng bộ nhớ)</text>

  <!-- Right Steps -->
  <!-- Step 1 -->
  <g transform="translate(495, 130)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#d9f7be" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước 1:</text>
    <text x="75" y="28" font-size="13" fill="#212529">Tính Q1, K1, V1 → <tspan font-weight="bold" fill="#237804">Lưu K1, V1 vào Cache</tspan></text>
  </g>
  <line x1="682" y1="176" x2="682" y2="192" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 2 -->
  <g transform="translate(495, 195)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#d9f7be" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước 2:</text>
    <text x="75" y="28" font-size="13" fill="#212529">Lấy K1,V1 cũ + <tspan font-weight="bold" fill="#237804">Chỉ tính &amp; nối K2, V2</tspan></text>
  </g>
  <line x1="682" y1="241" x2="682" y2="257" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Step 3 -->
  <g transform="translate(495, 260)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#d9f7be" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước 3:</text>
    <text x="75" y="28" font-size="13" fill="#212529">Lấy K1..2 cũ + <tspan font-weight="bold" fill="#237804">Chỉ tính &amp; nối K3, V3</tspan></text>
  </g>
  <line x1="682" y1="306" x2="682" y2="322" stroke="#2f9e44" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Step t -->
  <g transform="translate(495, 325)">
    <rect width="375" height="46" rx="6" fill="#ffffff" stroke="#d9f7be" stroke-width="1" filter="url(#shadow)"/>
    <text x="15" y="28" font-size="13" font-weight="600" fill="#495057">Bước t:</text>
    <text x="75" y="28" font-size="13" fill="#212529">Lấy K,V cũ + <tspan font-weight="bold" fill="#237804">Chỉ tính kt, vt cho token t</tspan></text>
  </g>

  <!-- Right Summary Box -->
  <rect x="495" y="390" width="375" height="50" rx="6" fill="#f6ffed" stroke="#b7eb8f"/>
  <text x="510" y="411" font-size="12" font-weight="bold" fill="#237804">• Độ phức tạp mỗi bước: Tuyến tính O(t)</text>
  <text x="510" y="429" font-size="12" fill="#595959">• Tối ưu hóa tốc độ sinh từ, tái sử dụng VRAM</text>
</svg>
